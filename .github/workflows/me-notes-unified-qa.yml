name: ME Notes Unified Finance QA
on:
  push:
    branches:
      - feature/me-notes-unified-dashboard-20261113
  pull_request:
    branches:
      - me-notes-sahifalab-diary
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unified-api-and-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install same dependencies as Render
        run: npm --prefix me-notes-bot install --omit=dev
      - name: JS syntax checks
        run: |
          node --check me-notes-bot/miniapp-auth.cjs
          node --check me-notes-bot/miniapp-api.cjs
          node --check me-notes-bot/server.cjs
          node --check me-notes-sahifalab/finance-unified.js
          node --check me-notes-sahifalab/finance-sw.js
      - name: API security and shared ledger tests
        run: node --test me-notes-bot/tests/miniapp-api.test.cjs
      - name: Existing finance and Telegram list regression
        run: node --test tests/finance-core.test.cjs tests/me-notes-list.test.cjs
      - name: Unified UI link and fallback smoke
        run: |
          node -e "const fs=require('fs');const h=fs.readFileSync('me-notes-sahifalab/finance-unified.html','utf8');const js=fs.readFileSync('me-notes-sahifalab/finance-unified.js','utf8');for(const x of ['view-home','view-records','view-budget','view-settings','legacy-file','finance-unified.js'])if(!h.includes(x))throw Error('Missing '+x);for(const x of ['X-Telegram-Init-Data','function importLegacy','state.queue','function flush'])if(!js.includes(x))throw Error('Missing '+x);"
