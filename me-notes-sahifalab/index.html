<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#f6f8fc"/>
<meta name="description" content="ME Notes — Telegram ichidagi daromad, xarajat, byudjet va hisobot yordamchisi."/>
<title>ME Notes — Moliya boshqaruvi</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#203048;background:#f5f7fc}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:20px}
main{width:100%;max-width:470px;background:white;border:1px solid #e6eaf3;border-radius:22px;padding:28px 23px;box-shadow:0 8px 34px #182b4710}
.logo{display:inline-grid;place-items:center;width:58px;height:58px;background:#e9f1ff;border-radius:16px;color:#195eaf;font-weight:850;font-size:25px;margin-bottom:10px}
h1{font-size:26px;line-height:1.2;margin:6px 0}p{color:#63748a;line-height:1.6}
a.action{display:block;background:#246ce3;color:white;border-radius:13px;text-align:center;padding:13px 16px;font-size:16px;font-weight:750;text-decoration:none;margin-top:22px}
ul{list-style:none;padding:0;line-height:2;color:#3d4c60}li::before{content:"✓ ";color:#128256;font-weight:750}
small{color:#718095;display:block;margin-top:16px}
</style>
</head>
<body>
<main>
<div class="logo">ME</div>
<h1>ME Notes</h1>
<p>Daromad va xarajatlaringizni Telegram orqali boshqaring.</p>
<ul>
<li>Tezkor yozuvlar</li>
<li>Oylik byudjet va limitlar</li>
<li>Hisobot va arxiv</li>
</ul>
<a class="action" href="https://t.me/ME_notes_bot">Telegram botni ochish</a>
<small>Botda /start yuborib, «Moliya boshqaruvi» tugmasini bosing.</small>
</main>
<!-- BotFather Main Mini App URL may still point to the site root.
     Reuse the Telegram launch fragment so its signed initData survives navigation. -->
<script src="https://telegram.org/js/telegram-web-app.js?64"></script>
<script id="miniapp-entry-router">
(() => {
 'use strict';
 const launch=new URLSearchParams(window.location.hash.slice(1));
 const hasTelegramLaunch=launch.has('tgWebAppData') && launch.has('tgWebAppVersion');
 const hasTelegramSession=Boolean(window.Telegram?.WebApp?.initData);
 if (!hasTelegramLaunch && !hasTelegramSession) return;
 const finance=new URL('./finance-unified.html',window.location.href);
 finance.search=window.location.search;
 finance.hash=window.location.hash;
 // Replace (not push) the landing page in this WebView's navigation stack.
 window.location.replace(finance.href);
})();
</script>
</body>
</html>
